services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth:
    build: ./auth-service
    environment:
      APP_CONFIG__DB__URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/shop_user
      APP_CONFIG__AUTH__SECRET: ${JWT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  catalog:
    build: ./catalog-service
    environment:
      APP_CONFIG__DB__URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/shop_catalog
      APP_CONFIG__AUTH__SECRET: ${JWT_SECRET}
      APP_CONFIG__REDIS__URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  inventory:
    build: ./inventory-service
    environment:
      APP_CONFIG__DB__URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/shop_inventory
      APP_CONFIG__AUTH__SECRET: ${JWT_SECRET}
      APP_CONFIG__RABBIT__URL: amqp://guest:guest@rabbitmq:5672/
      APP_CONFIG__RESERVATION__TTL_SECONDS: ${RESERVATION_TTL:-1200}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy

  cart:
    build: ./cart-service
    environment:
      APP_CONFIG__AUTH__SECRET: ${JWT_SECRET}
      APP_CONFIG__REDIS__URL: redis://redis:6379/1
      APP_CONFIG__CATALOG__URL: http://catalog:8000
    depends_on:
      redis:
        condition: service_healthy
      catalog:
        condition: service_started

  order:
    build: ./order-service
    environment:
      APP_CONFIG__DB__URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/shop_order
      APP_CONFIG__AUTH__SECRET: ${JWT_SECRET}
      APP_CONFIG__RABBIT__URL: amqp://guest:guest@rabbitmq:5672/
      APP_CONFIG__CART__URL: http://cart:8000
      APP_CONFIG__CATALOG__URL: http://catalog:8000
      APP_CONFIG__SAGA__PENDING_TIMEOUT_SECONDS: ${ORDER_PENDING_TIMEOUT:-900}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      cart:
        condition: service_started
      catalog:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  payment:
    build: ./payment-service
    environment:
      APP_CONFIG__DB__URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/shop_payment
      APP_CONFIG__AUTH__SECRET: ${JWT_SECRET}
      APP_CONFIG__RABBIT__URL: amqp://guest:guest@rabbitmq:5672/
      APP_CONFIG__PAYMENT__SUCCESS_RATE: ${PAYMENT_SUCCESS_RATE:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification:
    build: ./notification-service
    environment:
      APP_CONFIG__DB__URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/shop_notification
      APP_CONFIG__AUTH__SECRET: ${JWT_SECRET}
      APP_CONFIG__RABBIT__URL: amqp://guest:guest@rabbitmq:5672/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - auth
      - catalog
      - cart
      - order
      - inventory
      - payment
      - notification