events {
    worker_connections 1024;
}

http {
    # общий лимит на клиента и жёсткий лимит на вход/регистрацию
    limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_status 429;

    upstream auth_svc         { server auth:8000; }
    upstream catalog_svc      { server catalog:8000; }
    upstream cart_svc         { server cart:8000; }
    upstream order_svc        { server order:8000; }
    upstream inventory_svc    { server inventory:8000; }
    upstream payment_svc      { server payment:8000; }
    upstream notification_svc { server notification:8000; }

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;
        default_type application/json;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        limit_req zone=api burst=40 nodelay;

        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
        }

        # защита от перебора паролей и массовой регистрации
        location = /api/v1/auth/jwt/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://auth_svc;
        }
        location = /api/v1/auth/register {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://auth_svc;
        }

        location /api/v1/auth/          { proxy_pass http://auth_svc; }
        location ~ ^/api/v1/(products|categories)(/|$) { proxy_pass http://catalog_svc; }
        location ~ ^/api/v1/cart(/|$)          { proxy_pass http://cart_svc; }
        location ~ ^/api/v1/orders(/|$)        { proxy_pass http://order_svc; }
        location ~ ^/api/v1/inventory(/|$)     { proxy_pass http://inventory_svc; }
        location ~ ^/api/v1/payments(/|$)      { proxy_pass http://payment_svc; }
        location ~ ^/api/v1/notifications(/|$) { proxy_pass http://notification_svc; }

        location / {
            return 404 '{"detail":"Not found"}';
        }
    }
}